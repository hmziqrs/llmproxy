[package]
name = "llm-proxy-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
llm-proxy-core = { workspace = true }
llm-proxy-protocol = { path = "../llm-proxy-protocol" }
llm-proxy-provider = { path = "../llm-proxy-provider" }

axum = { workspace = true, features = ["macros", "json"] }
axum-serde = { workspace = true, features = ["sonic"] }
tokio = { workspace = true }
tokio-stream = "0.1"
tokio-util = { workspace = true }
tower = { workspace = true }
tower-http = { version = "0.6", features = ["trace", "timeout"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
bytes = "1"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
futures = "0.3"
regex = { workspace = true }
sha2 = "0.10"

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
